app = "echo-wave-api"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# UNLIMITED - 2GB RAM, more CPU
[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2

[env]
  PYTHONUNBUFFERED = "1"
  FLASK_ENV = "production"